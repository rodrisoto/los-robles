{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
       body {
    margin: 0;
    height: 100vh;
    background: url("{% static 'img/fondo_login.png' %}") no-repeat center center;
    background-size: cover;
    font-family: Arial, sans-serif;
}

        /* capa blur */
        .overlay {
            backdrop-filter: blur(8px);
            background-color: rgba(255,255,255,0.25);
            height: 100vh;
            width: 100%;
            position: absolute;
        }

        .login-container {
            height: 100vh;
            position: relative;
            z-index: 2;
        }

        .login-card {
            background: rgba(255,255,255,0.9);
            padding: 30px;
            border-radius: 15px;
            width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo h4 {
            color: #2c5cc5;
            font-weight: bold;
        }

        .form-control {
            border-radius: 8px;
            height: 45px;
        }

        .btn-login {
            background: linear-gradient(90deg, #2c5cc5, #3a7bd5);
            border: none;
            height: 45px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
        }

        .btn-login:hover {
            background: linear-gradient(90deg, #244fa8, #2f6cc4);
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

<div class="overlay"></div>

<div class="container d-flex justify-content-center align-items-center login-container">

    <div class="login-card">

        <!-- LOGO -->
        <div class="logo">
            <h4>Sistema de Gestión</h4>
            <p style="margin:0;">de Medicación</p>
        </div>

        <!-- ERROR -->
        {% if form.errors %}
        <div class="alert alert-danger">
            Usuario o contraseña incorrectos
        </div>
        {% endif %}

        <!-- FORM -->
        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label>Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Ingrese su usuario" required>
            </div>

            <div class="mb-3">
                <label>Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="********" required>
            </div>

            <button type="submit" class="btn btn-login w-100">Ingresar</button>

        </form>

    </div>

</div>

</body>
</html>
